<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilha da Fluência — 500 Palavras em Inglês</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#101a2e; --bg2:#182648;
  --card:#f4ecd8; --card-line:#d8c9a3; --ink:#1c2340; --muted:#6b6552;
  --gold:#e0a83e; --coral:#e2604f; --green:#3fa77f; --blue:#3a6ea5;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, rgba(224,168,62,.12), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(58,110,165,.18), transparent 45%),
    linear-gradient(160deg, var(--bg), var(--bg2));
  font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif;
  color:#eee8d6; display:flex; justify-content:center; padding:24px 14px 60px;
}
.wrap{width:100%;max-width:820px;}
.brand{text-align:center;margin-bottom:18px;}
.brand .stamp{display:inline-block;border:3px solid var(--gold);color:var(--gold);padding:6px 18px;border-radius:999px;font-weight:700;letter-spacing:2px;font-size:12px;text-transform:uppercase;transform:rotate(-2deg);}
.brand h1{font-size:clamp(24px,5vw,36px);margin:10px 0 4px;}
.brand p{color:#b9b3a0;margin:0;font-size:14px;}

.panel{background:var(--card);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);padding:26px 24px;position:relative;overflow:hidden;min-height:120px;}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px, transparent 14px 24px);}

.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.hud .stat{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;}
.hud .stat span{display:block;font-size:17px;color:var(--ink);letter-spacing:0;text-transform:none;}
.phase-track{display:flex;gap:4px;margin-bottom:6px;}
.phase-dot{flex:1;height:8px;border-radius:4px;background:#e2d6ae;overflow:hidden;}
.phase-dot .fill{height:100%;background:var(--green);width:0%;transition:width .3s;}
.phase-dot.current .fill{background:var(--gold);}
.progress-track{height:8px;background:#e2d6ae;border-radius:999px;overflow:hidden;margin:6px 0 20px;border:1px solid var(--card-line);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));width:0%;transition:width .4s ease;}

input[type=text]{width:100%;padding:13px 14px;border-radius:10px;border:2px solid var(--card-line);font-size:15px;font-family:inherit;margin-bottom:12px;}
.btn{border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{box-shadow:0 6px 14px rgba(58,110,165,.4);}
.btn-gold{background:var(--gold);color:#26200f;}
.btn-ghost{background:transparent;border:2px solid var(--ink);color:var(--ink);}
.btn-block{width:100%;}
.center{text-align:center;}

.stats-row{display:flex;gap:12px;justify-content:center;margin:16px 0;flex-wrap:wrap;}
.stat-card{background:#fff8e6;border:1px solid var(--card-line);border-radius:12px;padding:10px 16px;min-width:100px;text-align:center;}
.stat-card b{display:block;font-size:20px;color:var(--blue);}
.stat-card span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}

.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;border-radius:999px;margin-bottom:12px;}
.tag.vocab{background:#dfeee5;color:var(--green);}
.tag.expr{background:#fde3dc;color:var(--coral);}
.tag.read{background:#e0eaf5;color:var(--blue);}

.question{font-size:19px;font-weight:700;margin:0 0 6px;line-height:1.4;}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
.options{display:grid;gap:10px;}
.opt{text-align:left;padding:14px 16px;border-radius:10px;border:2px solid var(--card-line);background:#fffdf5;font-size:15px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s;}
.opt:hover{border-color:var(--blue);}
.opt.correct{background:#dcf3e7;border-color:var(--green);}
.opt.wrong{background:#fbdbd4;border-color:var(--coral);}
.opt[disabled]{cursor:default;}

.feedback{margin-top:16px;padding:14px;border-radius:10px;font-size:14px;line-height:1.5;}
.feedback.ok{background:#dcf3e7;color:#1c4d38;}
.feedback.bad{background:#fbdbd4;color:#5c2018;}

.text-title{font-size:19px;font-weight:700;margin-bottom:4px;}
.hint{font-size:13px;color:var(--muted);margin-bottom:14px;}
.paragraph{background:#fffdf5;border:2px solid var(--card-line);border-radius:12px;padding:18px;font-size:16px;line-height:2;}
.word{padding:2px 3px;border-radius:5px;cursor:pointer;}
.word.circled{background:var(--gold);color:#26200f;box-shadow:0 0 0 2px var(--gold);}
textarea{width:100%;min-height:80px;margin-top:16px;padding:12px;border-radius:10px;border:2px solid var(--card-line);font-family:inherit;font-size:14px;resize:vertical;}
.summary-box{margin-top:14px;background:#e0eaf5;border-radius:10px;padding:14px;font-size:14px;line-height:1.5;display:none;}
.summary-box.show{display:block;}

.actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.big-icon{font-size:52px;text-align:center;margin-bottom:6px;}
.result-title{text-align:center;font-size:24px;font-weight:800;margin:0 0 6px;}
.result-sub{text-align:center;color:var(--muted);margin-bottom:16px;font-size:14px;}

.leaderboard{margin-top:18px;background:#fffdf5;border:2px solid var(--card-line);border-radius:12px;overflow:hidden;}
.leaderboard h3{margin:0;padding:12px 16px;background:#e2d6ae;font-size:13px;text-transform:uppercase;letter-spacing:1px;}
.lb-row{display:flex;justify-content:space-between;padding:10px 16px;font-size:14px;border-top:1px solid var(--card-line);}
.lb-row b{color:var(--blue);}
.lb-row.me{background:#fdf3d8;}
.lb-empty{padding:14px 16px;font-size:13px;color:var(--muted);}

footer{text-align:center;color:#8f8874;font-size:12px;margin-top:20px;}
.spin{opacity:.6;text-align:center;padding:20px;font-size:14px;}
@media(max-width:480px){.panel{padding:20px 16px;} .question{font-size:17px;}}

/* ===== Modos animados de pergunta ===== */
.arcade-wrap{position:relative;}
.arcade-timer{height:8px;border-radius:99px;background:#e5dcc0;overflow:hidden;margin-bottom:14px;}
.arcade-timer-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--coral));width:100%;transform-origin:left;}
.arcade-timer-fill.running{animation:arcadeCountdown linear forwards;}
@keyframes arcadeCountdown{ from{width:100%;} to{width:0%;} }

.arcade-area{position:relative;min-height:320px;border-radius:14px;overflow:hidden;margin-bottom:6px;}
.arcade-mode-balloon .arcade-area,.arcade-mode-orbit .arcade-area,.arcade-mode-zigzag .arcade-area,.arcade-mode-target .arcade-area{background:linear-gradient(180deg,#dcecff,#eef6ff);}
.arcade-mode-fall .arcade-area{background:linear-gradient(180deg,#1c2340,#101a2e);}
.arcade-mode-rock .arcade-area{background:linear-gradient(180deg,#e7ddc4,#d8c9a3);}

.chip{position:absolute;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;border:2px solid var(--card-line);background:#fffdf5;color:var(--ink);box-shadow:var(--shadow);user-select:none;transition:transform .15s;white-space:nowrap;}
.chip:active{transform:scale(.94);}
.chip.correct{background:#dcf3e7;border-color:var(--green);}
.chip.wrong{background:#fbdbd4;border-color:var(--coral);opacity:.6;}
.chip.disabled{pointer-events:none;animation-play-state:paused!important;}

/* Balões flutuando */
.chip-balloon{border-radius:999px 999px 999px 0/999px 999px 60% 0;padding:14px 18px;animation:balloonFloat 3.4s ease-in-out infinite;}
.chip-balloon::after{content:'';position:absolute;left:50%;bottom:-10px;width:2px;height:10px;background:var(--card-line);}
@keyframes balloonFloat{ 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-16px) rotate(3deg);} }

/* Palavras caindo (estilo Tetris) — mais lento, uma pista por palavra, sem sobrepor */
.chip-fall{background:#fffdf5;animation:chipFall linear forwards;}
@keyframes chipFall{ from{transform:translateY(-60px);} to{transform:translateY(300px);} }

/* Balões orbitando */
.chip-orbit{transition:none;}

/* Zigue-zague */
.chip-zigzag{background:#fffdf5;}

/* Tiro ao alvo */
.chip-target{border-radius:50%;width:88px;height:88px;padding:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.15;background:
    radial-gradient(circle at center, #fffdf5 0 18%, var(--coral) 18% 32%, #fffdf5 32% 46%, var(--blue) 46% 60%, #fffdf5 60% 100%);
  border:2px solid var(--card-line);}
.chip-target.hit{animation:targetHit .3s ease forwards;}
@keyframes targetHit{ 0%{transform:scale(1);} 50%{transform:scale(1.25);} 100%{transform:scale(.85);} }

/* Pedras para quebrar */
.chip-rock{position:static;display:inline-flex;align-items:center;justify-content:center;min-width:110px;min-height:64px;margin:10px 14px;border-radius:38% 62% 55% 45%/52% 42% 58% 48%;background:linear-gradient(155deg,#9c9284,#6b6552);color:#fff5df;border:none;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25), 0 6px 10px rgba(0,0,0,.25);}
.chip-rock::before{content:'🔨';position:absolute;top:-14px;right:-6px;font-size:18px;opacity:0;transition:opacity .1s;}
.chip-rock.smash{animation:rockSmash .35s ease forwards;}
.chip-rock.smash::before{opacity:1;}
@keyframes rockSmash{ 0%{transform:scale(1);} 40%{transform:scale(1.15) rotate(-4deg);} 100%{transform:scale(0);opacity:0;} }
.rock-grid{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;padding:24px;min-height:320px;}

.arcade-hint{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 14px;}

/* ===== Mapa do mundo (estilo Super Mario) ===== */
.world-map{border-radius:16px;padding:14px 10px 6px;margin-top:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4), var(--shadow);position:relative;overflow:hidden;}
.world-title{text-align:center;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);margin-bottom:4px;font-size:15px;}
.world-sub{font-weight:600;opacity:.9;font-size:12px;}
.wm-svg{width:100%;height:auto;display:block;}
.wm-char{font-size:26px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));animation:wmBob 1.6s ease-in-out infinite;}
@keyframes wmBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }

/* ===== Cena de jogo (personagem correndo + placa da pergunta) ===== */
.game-scene{position:relative;height:92px;border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
.game-clouds{position:absolute;top:8px;left:0;width:220%;height:20px;
  background-image:radial-gradient(ellipse 22px 10px at 20px 8px, rgba(255,255,255,.85), transparent 70%),
                    radial-gradient(ellipse 16px 8px at 90px 12px, rgba(255,255,255,.7), transparent 70%),
                    radial-gradient(ellipse 20px 9px at 170px 6px, rgba(255,255,255,.8), transparent 70%);
  background-repeat:repeat-x;background-size:220px 20px;animation:cloudDrift 14s linear infinite;}
@keyframes cloudDrift{ from{transform:translateX(0);} to{transform:translateX(-110px);} }
.game-ground{position:absolute;bottom:0;left:0;width:220%;height:16px;
  background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 10px, transparent 10px 26px);
  background-color:rgba(0,0,0,.12);animation:groundScroll .7s linear infinite;}
@keyframes groundScroll{ from{transform:translateX(0);} to{transform:translateX(-26px);} }
.game-char{position:absolute;bottom:14px;font-size:28px;transition:left .5s ease;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));transform-origin:bottom center;
  animation:charRun .3s steps(2) infinite, charHop 2.2s ease-in-out infinite;}
@keyframes charRun{ 0%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-6px) rotate(6deg);} 100%{transform:translateY(0) rotate(-6deg);} }
@keyframes charHop{ 0%,78%,100%{margin-bottom:0;} 88%{margin-bottom:16px;} }
.game-sign{position:absolute;top:6px;right:10px;font-size:20px;background:#fff;border-radius:8px;padding:4px 7px;
  box-shadow:var(--shadow);animation:signPop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes signPop{ 0%{transform:scale(0) translateY(10px);opacity:0;} 70%{transform:scale(1.15) translateY(0);opacity:1;} 100%{transform:scale(1) translateY(0);} }
.game-scene-label{position:absolute;bottom:4px;left:8px;font-size:10px;font-weight:700;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.4);background:rgba(0,0,0,.18);padding:2px 6px;border-radius:99px;}

/* ===== Modo Caminhos: corredor em tempo real, personagem corre sozinho e você troca de pista ===== */
.arcade-mode-path .arcade-area{background:linear-gradient(180deg,#dcecff,#eef6ff);}
.path-lane{position:absolute;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg, rgba(120,110,80,.4) 0 8px, transparent 8px 16px);}
.chip.path-sign{position:absolute;white-space:nowrap;transition:none;}
.path-char{position:absolute;font-size:30px;transition:top .2s ease;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));z-index:5;}
.path-char.running{animation:charRun .22s steps(2) infinite;}
.path-char.hit{animation:charHit .5s ease;}
@keyframes charHit{ 0%{transform:rotate(0);} 30%{transform:rotate(-20deg) translateX(-6px);} 60%{transform:rotate(15deg) translateX(4px);} 100%{transform:rotate(0);} }
.path-obstacle{position:absolute;font-size:26px;top:0;z-index:4;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));}

.path-controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 4px;}
.path-btn{border:2px solid var(--card-line);background:#fffdf5;color:var(--ink);border-radius:12px;padding:10px 16px;
  font-size:14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);}
.path-btn:active{transform:scale(.94);}

/* ===== Grade de seleção de mundos ===== */
.world-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.world-card{border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;position:relative;}
.world-card:active{transform:scale(.96);}
.world-card.locked{cursor:default;filter:grayscale(1) brightness(.75);}
.world-card-icon{font-size:30px;margin-bottom:4px;}
.world-card-name{font-weight:800;font-size:14px;color:#20263f;text-shadow:0 1px 2px rgba(255,255,255,.5);}
.world-card-sub{font-size:11px;color:#2c3350;opacity:.85;margin-top:2px;}
.world-card-progress{margin-top:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.7);border-radius:99px;padding:3px 8px;display:inline-block;color:#20263f;}
@media(max-width:420px){.world-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="stamp">Everyday English</span>
    <h1>🗺️ Trilha da Fluência</h1>
    <p>6 fases · +500 palavras e expressões do dia a dia — erre uma vez e volte ao início!</p>
  </div>
  <div class="panel" id="panel"><div class="spin">Carregando...</div></div>
  <footer>Seu cadastro fica salvo neste dispositivo. O ranking é compartilhado e visível para todos que jogarem esta trilha.</footer>
</div>

/* ================= HELPERS ================= */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickDistractors(pool,correctVal,key,n){
  const vals = pool.map(x=>x[key]).filter(v=>v!==correctVal);
  return shuffle(vals).slice(0,n);
}
function buildVocabStage(item,pool,idx){
  let question,correct,options;
  if(idx%2===0){
    question = `Qual é a tradução da palavra <b>"${item.en}"</b>?`;
    correct = item.pt;
    options = shuffle([correct,...pickDistractors(pool,correct,'pt',3)]);
  } else {
    question = `Qual é a palavra em inglês para <b>"${item.pt.split(',')[0]}"</b>?`;
    correct = item.en;
    options = shuffle([correct,...pickDistractors(pool,correct,'en',3)]);
  }
  return {kind:'vocab',tag:'Vocabulário · Nível 1',question,correct,options};
}
/* Nível 2: a palavra aparece dentro de uma frase, com uma lacuna — escolha a palavra certa */
function buildLevel2Stage(item,pool){
  const re = new RegExp(item.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
  const blanked = item.ex.replace(re, '_____');
  const question = `Complete a frase com a palavra certa:<br><span class="sub" style="display:block;margin-top:6px;"><i>"${blanked}"</i></span>`;
  const correct = item.en;
  const options = shuffle([correct,...pickDistractors(pool.filter(w=>w.ex),correct,'en',3)]);
  return {kind:'vocab',tag:'Vocabulário · Nível 2 (em frase)',question,correct,options};
}
/* Nível 3: a frase completa aparece com a palavra destacada — escolha o significado no contexto */
function buildLevel3Stage(item,pool){
  const re = new RegExp('('+item.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')', 'i');
  const highlighted = item.ex.replace(re, '<b>$1</b>');
  const question = `Nesta frase, o que significa a palavra destacada?<br><span class="sub" style="display:block;margin-top:6px;"><i>"${highlighted}"</i></span>`;
  const correct = item.pt;
  const options = shuffle([correct,...pickDistractors(pool.filter(w=>w.ex),correct,'pt',3)]);
  return {kind:'expr',tag:'Vocabulário · Nível 3 (uso em contexto)',question,correct,options};
}
function buildExprStage(item,pool){
  const question = `O que significa a expressão <b>"${item.en}"</b>?<br><span class="sub" style="display:block;margin-top:6px;">Exemplo: <i>"${item.s}"</i></span>`;
  const correct = item.pt;
  const options = shuffle([correct,...pickDistractors(pool,correct,'pt',3)]);
  return {kind:'expr',tag:'Expressão',question,correct,options};
}
function buildReadStage(t,phaseName){
  return {kind:'read',tag:'Leitura — '+phaseName,title:t.title,p:t.p,sum:t.sum};
}

/* Build full stage list + phase boundaries */
let stages = [];
let phaseBounds = []; // {startIdx, endIdx, phaseIndex}
PHASES.forEach((ph,pi)=>{
  const start = stages.length;
  const withEx = ph.words.filter(w=>w.ex); // palavras que já têm frase de exemplo (níveis 2 e 3)
  // Nível 1 — todas as palavras da fase
  ph.words.forEach((w,i)=> stages.push({...buildVocabStage(w,ph.words,i), phaseIndex:pi}));
  // Nível 2 — só libera depois de concluir o nível 1 inteiro (ordem sequencial + erro reinicia a fase)
  if(withEx.length){ withEx.forEach(w=> stages.push({...buildLevel2Stage(w,withEx), phaseIndex:pi})); }
  // Nível 3 — só libera depois de concluir o nível 2 inteiro
  if(withEx.length){ withEx.forEach(w=> stages.push({...buildLevel3Stage(w,withEx), phaseIndex:pi})); }
  stages.push({...buildReadStage(ph.text,ph.name), phaseIndex:pi});
  if(ph.extra){ ph.extra.forEach(e=> stages.push({...buildExprStage(e,ph.extra), phaseIndex:pi})); }
  phaseBounds.push({start, end:stages.length-1, phaseIndex:pi});
});
const TOTAL = stages.length;
const TOTAL_WORDS = PHASES.reduce((a,p)=>a+p.words.length,0);

let subPhaseBounds = []; // [phaseIndex] -> array de 10 {start,end,subIndex}
PHASES.forEach((ph,pi)=>{
  const pb = phaseBounds[pi];
  const total = pb.end - pb.start + 1;
  const n = 10;
  const base = Math.floor(total/n), rem = total%n;
  let cursor = pb.start;
  const chunks = [];
  for(let i=0;i<n;i++){
    const size = base + (i < rem ? 1 : 0);
    if(size<=0){ chunks.push({start:cursor, end:cursor-1, subIndex:i}); continue; } // subfase vazia (fase com poucos estágios)
    chunks.push({start:cursor, end:cursor+size-1, subIndex:i});
    cursor += size;
  }
  subPhaseBounds.push(chunks);
});
function subPhaseOf(idx){
  const pb = phaseOf(idx);
  const chunks = subPhaseBounds[pb.phaseIndex];
  const sp = chunks.find(c=> idx>=c.start && idx<=c.end) || chunks[chunks.length-1];
  return {phaseIndex:pb.phaseIndex, subIndex:sp.subIndex, start:sp.start, end:sp.end};
}

function slug(name){ return name.toLowerCase().trim().replace(/[^a-z0-9à-ú ]/gi,'').replace(/\s+/g,'-').slice(0,40); }

async function setShared(key,val){
  try{
    const ref = db.collection('ranking').doc(slug(key));
    const current = await ref.get();
    if(current.exists){
      const prev = current.data();
      const better = (val.wordsLearned > prev.wordsLearned) ||
        (val.wordsLearned === prev.wordsLearned && val.completions > prev.completions);
      if(!better) return; // mantém o recorde anterior, que é maior ou igual
    }
    await ref.set(val);
  }catch(e){ console.error('Erro ao salvar ranking:', e); }
}

async function loadLeaderboard(){
  try{
    const snap = await db.collection('ranking').orderBy('wordsLearned','desc').limit(25).get();
    const rows = snap.docs.map(d=>d.data());
    rows.sort((a,b)=> (b.wordsLearned-a.wordsLearned) || (b.completions-a.completions));
    return rows.slice(0,10);
  }catch(e){
    console.error('Erro ao carregar ranking:', e);
    return [];
  }
}

      <div class="world-card-icon">${unlocked?world.icon:'🔒'}</div>
      <div class="world-card-name">${world.name}</div>
      <div class="world-card-sub">${ph.icon} ${ph.name}</div>
      <div class="world-card-progress">${progressTxt}</div>
    </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="center">
      <div class="tag vocab">🗺️ Mapa dos Mundos</div>
      <h2 style="margin:6px 0 8px;">Olá, ${state.player.name}! Escolha um mundo para jogar.</h2>
      <p class="sub" style="margin-bottom:0;">${TOTAL_WORDS} palavras em 6 mundos, 10 checkpoints cada.<br>Termine um mundo inteiro pra destravar o próximo. 😅</p>
    </div>
    <div class="stats-row">
      <div class="stat-card"><b>${stats.bestPhase}/6</b><span>Melhor mundo</span></div>
      <div class="stat-card"><b>${stats.attempts}</b><span>Tentativas</span></div>
      <div class="stat-card"><b>${stats.completions}</b><span>Trilhas zeradas</span></div>
    </div>
    <div class="world-grid">${worldCards}</div>
    <button class="btn btn-ghost btn-block" style="margin-top:14px;" onclick="startGame(0)">🔄 Recomeçar tudo do início</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="switchPlayer()">Trocar jogador</button>
    <div class="leaderboard">
      <h3>🏆 Ranking — palavras aprendidas (fase mais avançada)</h3>
      ${board.length? board.map((r,i)=>`<div class="lb-row ${r.name===state.player.name?'me':''}"><span>${i+1}. ${r.name}</span><span><b>${r.wordsLearned}</b> palavras · ${r.bestPhase}/6 fases</span></div>`).join('') : '<div class="lb-empty">Ainda ninguém no ranking. Seja o primeiro!</div>'}
    </div>
  `;
}

async function renderPhaseMap(pi){
  stopArcadeTimers();
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  const reachedIdx = stats.bestStage ? Math.min(stats.bestStage+1, TOTAL-1) : 0;
  const currentPi = stats.bestStage>0 ? phaseOf(reachedIdx).phaseIndex : 0;
  if(pi > currentPi){ renderStart(); return; } // segurança: mundo ainda bloqueado
  const world = WORLDS[pi];
  const ph = PHASES[pi];
  panel.innerHTML = `
    <button class="btn btn-ghost" style="margin-bottom:10px;" onclick="renderStart()">← Voltar aos mundos</button>
    <div class="center">
      <div class="tag vocab">${world.icon} ${world.name}</div>
      <h2 style="margin:6px 0 8px;">${ph.icon} ${ph.name}</h2>
      <p class="sub" style="margin-bottom:0;">Escolha um checkpoint desbloqueado no mapa abaixo.<br><b>Errou uma pergunta?</b> Você volta ao início do checkpoint atual, não do mundo inteiro. 😅</p>
    </div>
    ${renderWorldMap(pi, stats)}
  `;
}

async function registerPlayer(){
  const val = document.getElementById('nameInput').value.trim();
  if(!val){ document.getElementById('nameInput').focus(); return; }
  state.player = {name: val};
  await setPersonal('profile', state.player);
  const cloud = await loadPlayerFromCloud(val);
  const stats = cloud
    ? {attempts:cloud.attempts||0, completions:cloud.completions||0, bestPhase:cloud.bestPhase||0, bestStage:cloud.bestStage||0}
    : {attempts:0,completions:0,bestPhase:0,bestStage:0};
  await setPersonal('stats', stats);
  renderStart();
}
async function switchPlayer(){
  state.player = null;
  await setPersonal('profile', null);
  renderStart();
}

function phaseOf(idx){ return phaseBounds.find(b=> idx>=b.start && idx<=b.end); }

/* Retorna o índice do estágio onde a SUBFASE em andamento começa (checkpoint mais fino que a fase inteira) */
function getCheckpointIdx(stats){
  if(!stats || !stats.bestStage || stats.bestStage<=0) return 0;
  const idx = Math.min(stats.bestStage+1, TOTAL-1);
  const sp = subPhaseOf(idx);
  return sp.start;
}

/* Mapa do mundo estilo Super Mario: 10 checkpoints numerados, personagem no ponto alcançado */
function renderWorldMap(pi, stats){
  const world = WORLDS[pi];
  const ph = PHASES[pi];
  const chunks = subPhaseBounds[pi];
  const reachedIdx = stats && stats.bestStage ? Math.min(stats.bestStage+1, TOTAL-1) : 0;
  const reachedSp = subPhaseOf(Math.max(reachedIdx, phaseBounds[pi].start));
  const furthestSub = reachedSp.phaseIndex===pi ? reachedSp.subIndex : -1; // -1 = fase ainda não começou

  const W=340, H=460;
  const nodePos = chunks.map((_,i)=>{
    const t = i/(chunks.length-1);
    const x = 40 + (i%2===0 ? 0 : 1)*0 + (Math.sin(t*Math.PI*3)*70) + 100;
    const y = H - 40 - t*(H-80);
    return {x,y};
  });
  const pathD = nodePos.map((p,i)=> (i===0?'M':'L')+p.x+' '+p.y).join(' ');

  const nodesHtml = chunks.map((c,i)=>{
    const unlocked = i <= furthestSub || (furthestSub===-1 && i===0);
    const done = i < furthestSub || (furthestSub===chunks.length-1 && i===furthestSub && stats.completions>0 && pi===PHASES.length-1);
    const p = nodePos[i];
    const cls = unlocked ? (done?'wm-node done':'wm-node') : 'wm-node locked';
    return `<g class="${cls}" ${unlocked?`onclick="startGame(${c.start})"`:''} transform="translate(${p.x},${p.y})">
      <circle r="19" class="wm-circle"/>
      <text y="6" text-anchor="middle" class="wm-label">${done?'★':(unlocked?(i+1):'🔒')}</text>
    </g>`;
  }).join('');

  const charPos = furthestSub>=0 ? nodePos[Math.min(furthestSub,nodePos.length-1)] : nodePos[0];

  return `
  <div class="world-map" style="background:${world.bg};">
    <div class="world-title">${world.icon} ${world.name} <span class="world-sub">— ${ph.icon} ${ph.name}</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="wm-svg">
      <path d="${pathD}" fill="none" stroke="${world.path}" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 14"/>
      ${nodesHtml}
      <text x="${charPos.x}" y="${charPos.y-30}" text-anchor="middle" class="wm-char">🧑‍🚀</text>
    </svg>
  </div>
  <style>
    .wm-circle{fill:${world.node};stroke:#fff;stroke-width:3;}
    .wm-node.locked .wm-circle{fill:#9aa0a6;opacity:.55;}
    .wm-node.done .wm-circle{fill:${world.accent};}
    .wm-label{fill:#fff;font-size:14px;font-weight:800;font-family:inherit;}
    .wm-node{cursor:pointer;}
    .wm-node.locked{cursor:default;}
  </style>`;
}

/* Cena de jogo (topo das perguntas): personagem correndo pelo mundo atual,
   avançando conforme o progresso dentro do checkpoint, e a "placa" da pergunta surgindo. */
function renderGameScene(){
  const sp = subPhaseOf(state.idx);
  const world = WORLDS[sp.phaseIndex];
  const span = Math.max(1, sp.end - sp.start);
  const pct = Math.min(92, Math.max(6, ((state.idx - sp.start) / span) * 86 + 6));
  return `
    <div class="game-scene" style="background:${world.bg};">
      <div class="game-clouds"></div>
      <div class="game-ground"></div>
      <div class="game-char" style="left:${pct}%;">${world.icon==='🏔️'?'⛷️':'🏃'}</div>
      <div class="game-sign">${world.icon}</div>
      <div class="game-scene-label">${PHASES[sp.phaseIndex].name} · Checkpoint ${sp.subIndex+1}/10</div>
    </div>
  `;
}

function renderHUD(){
  const pb = phaseOf(state.idx);
  const pct = Math.round((state.idx/TOTAL)*100);
  const dots = PHASES.map((p,i)=>{
    let fillPct = 0;
    if(i < pb.phaseIndex) fillPct = 100;
    else if(i === pb.phaseIndex){
      const b = phaseBounds[i];
      fillPct = Math.round(((state.idx-b.start)/(b.end-b.start+1))*100);
    }
    return `<div class="phase-dot ${i===pb.phaseIndex?'current':''}" title="${p.icon} ${p.name}"><div class="fill" style="width:${fillPct}%"></div></div>`;
  }).join('');
  return `
    <div class="hud">
      <div class="stat">Fase ${pb.phaseIndex+1}/6<span>${PHASES[pb.phaseIndex].icon} ${PHASES[pb.phaseIndex].name}</span></div>
      <div class="stat">Pontos<span>${state.score}</span></div>
    </div>
    <div class="phase-track">${dots}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;
}

async function startGame(fromIdx=0){
  state = {idx:fromIdx,score:0,answered:false,player:state.player};
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  stats.attempts++; await saveStats(stats);
  renderStage();
}

async function updateBest(){
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  const pb = phaseOf(Math.min(state.idx, TOTAL-1));
  if(pb.phaseIndex > stats.bestPhase) stats.bestPhase = pb.phaseIndex;
  if(state.idx > stats.bestStage) stats.bestStage = state.idx;
  await saveStats(stats);
  const wordsLearned = Math.min(state.idx, TOTAL_WORDS);
  await setShared(state.player.name, {
    name: state.player.name, wordsLearned, bestPhase: stats.bestPhase+1, completions: stats.completions, date: new Date().toISOString()
  });
}

function renderStage(){
  stopArcadeTimers();
  const s = stages[state.idx];
  state.answered = false;
  if(s.kind==='read'){ renderReadStage(s); } else { renderQuestionStage(s); }
}

const ARCADE_MODES = ['balloon','fall','orbit','rock','zigzag','target'];
let arcadeTimerId = null;
let arcadeAnimFrame = null;

function renderQuestionStage(s){
  const mode = ARCADE_MODES[Math.floor(Math.random()*ARCADE_MODES.length)];
  const hints = {
    balloon:'🎈 Estoure o balão com a resposta certa antes que o tempo acabe!',
    fall:'⬇️ Toque na palavra certa antes que ela caia até o fim!',
    orbit:'🌀 As opções giram ao redor — clique na resposta certa a tempo!',
    rock:'🔨 Quebre a pedra com a resposta certa antes que o tempo acabe!',
    zigzag:'↯ As palavras se movem em zigue-zague — clique na certa a tempo!',
    target:'🎯 Mire e atire no alvo com a resposta certa!',
    path:'🏃 Corra sem parar! Use ▲ ▼ (ou as setas) pra trocar de pista, desvie das pedras 🪨 e capture a fruta 🍎 com a resposta certa!'
  };
  const chipsHtml = s.options.map((o,i)=>`<div class="chip chip-${mode}" data-i="${i}" data-val="${encodeURIComponent(o)}">${o}</div>`).join('');
  panel.innerHTML = `
    ${renderHUD()}
    <div class="tag ${s.kind}">${s.tag}</div>
    <p class="question">${s.question}</p>
    <div class="arcade-timer"><div class="arcade-timer-fill running" id="timerFill" style="animation-duration:10s;"></div></div>
    <div class="arcade-wrap arcade-mode-${mode}">
      <div class="${mode==='rock'?'arcade-area rock-grid':'arcade-area'}" id="arcadeArea">
        ${chipsHtml}
      </div>
    </div>
    ${mode==='path' ? `
    <div class="path-controls">
      <button class="path-btn" onclick="movePathLane(-1)">▲ Pista de cima</button>
      <button class="path-btn" onclick="movePathLane(1)">▼ Pista de baixo</button>
    </div>` : ''}
    <p class="arcade-hint">${hints[mode]}</p>
    <div id="feedbackArea"></div>
  `;
  initArcadeMode(mode, s);
}

/* Divide a área em faixas (colunas/linhas) para distribuir as opções sem sobrepor,
   com um pequeno espaço de respiro (gutter) entre elas. */
function slotLayout(n, areaW, areaH, chipW, chipH, gutter){
  const cols = n<=2 ? n : (n===3?3:2);
  const rows = Math.ceil(n/cols);
  const cellW = areaW/cols, cellH = areaH/rows;
  const slots = [];
  for(let i=0;i<n;i++){
    const col = i % cols, row = Math.floor(i/cols);
    const jitterX = (cellW - chipW - gutter*2) > 0 ? (Math.random()-0.5)*(cellW-chipW-gutter*2) : 0;
    const jitterY = (cellH - chipH - gutter*2) > 0 ? (Math.random()-0.5)*(cellH-chipH-gutter*2) : 0;
    slots.push({
      x: col*cellW + cellW/2 - chipW/2 + jitterX,
      y: row*cellH + cellH/2 - chipH/2 + jitterY
    });
  }
  // embaralha para não repetir sempre a mesma ordem visual
  for(let i=slots.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [slots[i],slots[j]]=[slots[j],slots[i]]; }
  return slots;
}

function initArcadeMode(mode, s){
  const area = document.getElementById('arcadeArea');
  const chips = Array.from(area.querySelectorAll('.chip'));
  const rect = area.getBoundingClientRect();
  const chipW = 120, chipH = 46, gutter = 10;

  if(mode==='balloon'){
    const slots = slotLayout(chips.length, rect.width, rect.height, chipW, chipH, gutter);
    chips.forEach((c,i)=>{
      c.style.left = slots[i].x+'px'; c.style.top = slots[i].y+'px';
      c.style.animationDelay = (Math.random()*1.5) + 's';
      c.style.animationDuration = (3.0 + Math.random()*1.2) + 's';
    });
  } else if(mode==='fall'){
    // uma pista (coluna) por palavra, para nunca sobrepor
    const lanes = chips.length;
    const laneW = rect.width/lanes;
    chips.forEach((c,i)=>{
      c.style.left = (i*laneW + laneW/2 - chipW/2) + 'px';
      c.style.animationDelay = (Math.random()*0.6) + 's';
      c.style.animationDuration = (6.5 + Math.random()*1.5) + 's'; // bem mais lento que antes
    });
  } else if(mode==='orbit'){
    const cx = rect.width/2, cy = rect.height/2;
    const radius = Math.min(cx,cy) - 55;
    const baseAngles = chips.map((_,i)=> (2*Math.PI/chips.length)*i);
    const start = performance.now();
    function frame(now){
      const t = (now-start)/1000;
      chips.forEach((c,i)=>{
        const angle = baseAngles[i] + t*0.45; // metade da velocidade anterior
        const x = cx + radius*Math.cos(angle) - c.offsetWidth/2;
        const y = cy + radius*Math.sin(angle) - c.offsetHeight/2;
        c.style.left = x+'px'; c.style.top = y+'px';
      });
      arcadeAnimFrame = requestAnimationFrame(frame);
    }
    arcadeAnimFrame = requestAnimationFrame(frame);
  } else if(mode==='zigzag'){
    const lanes = chips.length;
    const laneW = rect.width/lanes;
    const baseX = chips.map((_,i)=> i*laneW + laneW/2 - chipW/2);
    const amp = Math.max(18, laneW/2 - chipW/2 - 6);
    const freq = chips.map(()=> 0.6 + Math.random()*0.3);
    const phase = chips.map(()=> Math.random()*Math.PI*2);
    const speedY = 26; // px/s descendo
    const start = performance.now();
    function frame(now){
      const t = (now-start)/1000;
      chips.forEach((c,i)=>{
        const x = baseX[i] + amp*Math.sin(t*freq[i]*Math.PI + phase[i]);
        const y = -50 + Math.min(t*speedY, rect.height-40);
        c.style.left = x+'px'; c.style.top = y+'px';
      });
      arcadeAnimFrame = requestAnimationFrame(frame);
    }
    arcadeAnimFrame = requestAnimationFrame(frame);
  } else if(mode==='target'){
    const slots = slotLayout(chips.length, rect.width, rect.height, 88, 88, 14);
    chips.forEach((c,i)=>{ c.style.left = slots[i].x+'px'; c.style.top = slots[i].y+'px'; });
  } else if(mode==='path'){
    const rows = chips.length;
    const rowH = rect.height/rows;
    // linhas guia
    for(let i=0;i<rows;i++){
      const lane = document.createElement('div');
      lane.className = 'path-lane';
      lane.style.top = (i*rowH + rowH/2) + 'px';
      area.appendChild(lane);
    }
    // personagem correndo, fixo no eixo X, troca de pista na vertical
    const char = document.createElement('div');
    char.id = 'pathChar';
    char.className = 'path-char running';
    char.textContent = '🏃';
    char.style.left = '38px';
    area.appendChild(char);

    runnerLane = Math.floor(rows/2);
    runnerRows = rows;
    runnerRowH = rowH;
    runnerCharX = 38;
    char.style.top = (runnerLane*rowH + rowH/2 - char.offsetHeight/2) + 'px';

    // as 4 frutas (opções) chegam escalonadas, com 1-2 obstáculos de permeio pra desviar
    runnerObjects = [];
    const order = shuffle(chips.map((c,i)=>i));
    order.forEach((chipIdx,pos)=>{
      const c = chips[chipIdx];
      c.classList.add('path-sign','fruit');
      c.style.top = (chipIdx*rowH + rowH/2 - chipH/2) + 'px';
      c.style.left = (rect.width + 50 + pos*110) + 'px';
      c.textContent = '🍎 '+c.textContent;
      runnerObjects.push({el:c, type:'fruit', lane:chipIdx, x:rect.width+50+pos*110, resolved:false});
    });
    const obstacleCount = Math.min(2, rows-1);
    for(let i=0;i<obstacleCount;i++){
      const ob = document.createElement('div');
      ob.className = 'path-obstacle';
      ob.textContent = '🪨';
      const lane = Math.floor(Math.random()*rows);
      const x = rect.width + 50 + (i+0.5)*110 + Math.random()*40;
      ob.style.left = x+'px';
      ob.style.top = (lane*rowH + rowH/2 - 13) + 'px';
      area.appendChild(ob);
      runnerObjects.push({el:ob, type:'obstacle', lane, x, resolved:false});
    }

    pathKeyHandler = (e)=>{
      if(e.key==='ArrowUp'){ e.preventDefault(); movePathLane(-1); }
      else if(e.key==='ArrowDown'){ e.preventDefault(); movePathLane(1); }
    };
    window.addEventListener('keydown', pathKeyHandler);

    const speed = 110; // px por segundo
    let last = performance.now();
    function tick(now){
      const dt = (now-last)/1000; last = now;
      let stop = false;
      runnerObjects.forEach(o=>{
        if(o.resolved || stop) return;
        o.x -= speed*dt;
        o.el.style.left = o.x+'px';
        if(o.x <= runnerCharX+22 && o.x >= runnerCharX-22 && o.lane===runnerLane){
          o.resolved = true; stop = true;
          if(o.type==='obstacle'){ runnerHitObstacle(); }
          else { chooseArcade(o.el, decodeURIComponent(o.el.dataset.val), s.correct, 'path'); }
        } else if(o.x < -80){
          o.resolved = true; o.el.style.opacity='0';
        }
      });
      if(!stop) arcadeAnimFrame = requestAnimationFrame(tick);
    }
    arcadeAnimFrame = requestAnimationFrame(tick);
  }
  // rock: posições já vêm do layout em grade (rock-grid), sem posicionamento absoluto

  chips.forEach(c=>{
    if(mode!=='path'){
      c.addEventListener('click', ()=> chooseArcade(c, decodeURIComponent(c.dataset.val), s.correct, mode));
    }
  });

  arcadeTimerId = setTimeout(()=> arcadeTimeout(s), 10000);
}

/* Modo Caminhos: corredor em tempo real — o personagem corre sozinho, você só troca de pista
   (▲▼ ou setas) pra desviar de obstáculos e capturar a fruta com a resposta certa. */
let runnerObjects = [], runnerLane = 0, runnerRows = 4, runnerRowH = 0, runnerCharX = 38, pathKeyHandler = null;

function movePathLane(delta){
  if(state.answered) return;
  runnerLane = Math.max(0, Math.min(runnerRows-1, runnerLane+delta));
  const char = document.getElementById('pathChar');
  if(char) char.style.top = (runnerLane*runnerRowH + runnerRowH/2 - char.offsetHeight/2) + 'px';
}

function runnerHitObstacle(){
  if(state.answered) return;
  state.answered = true;
  stopArcadeTimers();
  const char = document.getElementById('pathChar');
  if(char){ char.classList.add('hit'); }
  document.querySelectorAll('#arcadeArea .chip').forEach(c=> c.classList.add('disabled'));
  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = `<div class="feedback bad">💥 Você bateu num obstáculo!</div>
    <div class="actions"><button class="btn btn-primary" onclick="gameOver()">Ver resultado</button></div>`;
}

function stopArcadeTimers(){
  if(arcadeTimerId){ clearTimeout(arcadeTimerId); arcadeTimerId = null; }
  if(arcadeAnimFrame){ cancelAnimationFrame(arcadeAnimFrame); arcadeAnimFrame = null; }
  if(pathKeyHandler){ window.removeEventListener('keydown', pathKeyHandler); pathKeyHandler = null; }
  runnerObjects = [];
}

function chooseArcade(el, chosen, correct, mode){
  if(state.answered) return;
  state.answered = true;
  stopArcadeTimers();
  const chips = document.querySelectorAll('#arcadeArea .chip');
  chips.forEach(c=>{
    c.classList.add('disabled');
    if(decodeURIComponent(c.dataset.val)===correct) c.classList.add('correct');
    if(mode==='rock') c.classList.add('smash');
    if(mode==='target') c.classList.add('hit');
  });
  const fb = document.getElementById('feedbackArea');
  if(chosen===correct){
    el.classList.add('correct');
    state.score += 10;
    fb.innerHTML = `<div class="feedback ok">✅ Certo! "<b>${correct}</b>" está correto.</div>
      <div class="actions"><button class="btn btn-primary" onclick="advance()">Continuar →</button></div>`;
  } else {
    el.classList.add('wrong');
    fb.innerHTML = `<div class="feedback bad">❌ Errado! A resposta certa era "<b>${correct}</b>".</div>
      <div class="actions"><button class="btn btn-primary" onclick="gameOver()">Ver resultado</button></div>`;
  }
}

function arcadeTimeout(s){
  if(state.answered) return;
  state.answered = true;
  stopArcadeTimers();
  const chips = document.querySelectorAll('#arcadeArea .chip');
  chips.forEach(c=>{
    c.classList.add('disabled');
    if(decodeURIComponent(c.dataset.val)===s.correct) c.classList.add('correct');
  });
  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = `<div class="feedback bad">⏱️ Tempo esgotado! A resposta certa era "<b>${s.correct}</b>".</div>
    <div class="actions"><button class="btn btn-primary" onclick="gameOver()">Ver resultado</button></div>`;
}

async function advance(){
  await updateBest();
  state.idx++;
  if(state.idx >= TOTAL){ victory(); } else { renderStage(); }
}

function renderReadStage(s){
  panel.innerHTML = `
    ${renderHUD()}
    <div class="tag read">${s.tag}</div>
    <p class="text-title">${s.title}</p>
    <p class="hint">Toque nas palavras que você já conhece para circulá-las. Depois, escreva em português o que você entendeu do texto.</p>
    <div class="paragraph" id="paragraphBox"></div>
    <textarea id="commentBox" placeholder="O que você entendeu deste texto? Escreva um resumo em português..."></textarea>
    <div id="summaryArea" class="summary-box"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="revealSummary('${btoa(unescape(encodeURIComponent(s.sum)))}')">Ver resumo e comparar</button>
      <button class="btn btn-primary" onclick="advance()">Continuar →</button>
    </div>
  `;
  document.getElementById('paragraphBox').innerHTML = s.p.split(' ').map(w=>`<span class="word" onclick="this.classList.toggle('circled')">${w}</span>`).join(' ');
}

function revealSummary(b64){
  const sum = decodeURIComponent(escape(atob(b64)));
  const area = document.getElementById('summaryArea');
  area.innerHTML = `<b>📌 Resumo do texto (para comparar com o seu):</b><br>${sum}`;
  area.classList.add('show');
}

async function gameOver(){
  stopArcadeTimers();
  await updateBest();
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  const sp = subPhaseOf(state.idx);
  const world = WORLDS[sp.phaseIndex];
  panel.innerHTML = `
    <div class="big-icon">💥</div>
    <p class="result-title">Ops! Você errou.</p>
    <p class="result-sub">Você chegou até o checkpoint ${sp.subIndex+1}/10 do ${world.icon} ${world.name} (${PHASES[sp.phaseIndex].name}), com ${state.score} pontos.<br>Sem problema — no mapa você volta pra esse mesmo checkpoint, não pro início do mundo inteiro.</p>
    <div class="stats-row">
      <div class="stat-card"><b>${stats.bestPhase+1}/6</b><span>Seu recorde</span></div>
      <div class="stat-card"><b>${stats.attempts}</b><span>Tentativas</span></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="renderPhaseMap(${sp.phaseIndex})">Ver mapa deste mundo</button>
  `;
}

async function victory(){
  stopArcadeTimers();
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  stats.completions++; stats.bestPhase = 5; stats.bestStage = TOTAL;
  await saveStats(stats);
  await setShared(state.player.name, {
    name: state.player.name, wordsLearned: TOTAL_WORDS, bestPhase: 6, completions: stats.completions, date: new Date().toISOString()
  });
  panel.innerHTML = `
    <div class="big-icon">🏆</div>
    <p class="result-title">Você zerou a Trilha da Fluência!</p>
    <p class="result-sub">${TOTAL_WORDS} palavras e 10 expressões, do início ao fim, sem errar uma questão. ${state.score} pontos. Fluência é treino diário — bora manter a sequência!</p>
    <div class="stats-row">
      <div class="stat-card"><b>${stats.completions}</b><span>Trilhas zeradas</span></div>
      <div class="stat-card"><b>${stats.attempts}</b><span>Tentativas totais</span></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="startGame()">🔁 Jogar de novo</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="renderStart()">Ver ranking</button>
  `;
}

boot();
</script>
</body>
</html>
