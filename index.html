<style>
:root{
  --bg:#101a2e; --bg2:#182648;
  --card:#f4ecd8; --card-line:#d8c9a3; --ink:#1c2340; --muted:#6b6552;
  --gold:#e0a83e; --coral:#e2604f; --green:#3fa77f; --blue:#3a6ea5;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, rgba(224,168,62,.12), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(58,110,165,.18), transparent 45%),
    linear-gradient(160deg, var(--bg), var(--bg2));
  font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif;
  color:#eee8d6; display:flex; justify-content:center; padding:24px 14px 60px;
}
.wrap{width:100%;max-width:820px;}
.brand{text-align:center;margin-bottom:18px;}
.brand .stamp{display:inline-block;border:3px solid var(--gold);color:var(--gold);padding:6px 18px;border-radius:999px;font-weight:700;letter-spacing:2px;font-size:12px;text-transform:uppercase;transform:rotate(-2deg);}
.brand h1{font-size:clamp(24px,5vw,36px);margin:10px 0 4px;}
.brand p{color:#b9b3a0;margin:0;font-size:14px;}

.panel{background:var(--card);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);padding:26px 24px;position:relative;overflow:hidden;min-height:120px;}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px, transparent 14px 24px);}

.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.hud .stat{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;}
.hud .stat span{display:block;font-size:17px;color:var(--ink);letter-spacing:0;text-transform:none;}
.phase-track{display:flex;gap:4px;margin-bottom:6px;}
.phase-dot{flex:1;height:8px;border-radius:4px;background:#e2d6ae;overflow:hidden;}
.phase-dot .fill{height:100%;background:var(--green);width:0%;transition:width .3s;}
.phase-dot.current .fill{background:var(--gold);}
.progress-track{height:8px;background:#e2d6ae;border-radius:999px;overflow:hidden;margin:6px 0 20px;border:1px solid var(--card-line);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));width:0%;transition:width .4s ease;}

input[type=text]{width:100%;padding:13px 14px;border-radius:10px;border:2px solid var(--card-line);font-size:15px;font-family:inherit;margin-bottom:12px;}
.btn{border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{box-shadow:0 6px 14px rgba(58,110,165,.4);}
.btn-gold{background:var(--gold);color:#26200f;}
.btn-ghost{background:transparent;border:2px solid var(--ink);color:var(--ink);}
.btn-block{width:100%;}
.center{text-align:center;}

.stats-row{display:flex;gap:12px;justify-content:center;margin:16px 0;flex-wrap:wrap;}
.stat-card{background:#fff8e6;border:1px solid var(--card-line);border-radius:12px;padding:10px 16px;min-width:100px;text-align:center;}
.stat-card b{display:block;font-size:20px;color:var(--blue);}
.stat-card span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}

.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;border-radius:999px;margin-bottom:12px;}
.tag.vocab{background:#dfeee5;color:var(--green);}
.tag.expr{background:#fde3dc;color:var(--coral);}
.tag.read{background:#e0eaf5;color:var(--blue);}

.question{font-size:19px;font-weight:700;margin:0 0 6px;line-height:1.4;}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
.options{display:grid;gap:10px;}
.opt{text-align:left;padding:14px 16px;border-radius:10px;border:2px solid var(--card-line);background:#fffdf5;font-size:15px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s;}
.opt:hover{border-color:var(--blue);}
.opt.correct{background:#dcf3e7;border-color:var(--green);}
.opt.wrong{background:#fbdbd4;border-color:var(--coral);}
.opt[disabled]{cursor:default;}

.feedback{margin-top:16px;padding:14px;border-radius:10px;font-size:14px;line-height:1.5;}
.feedback.ok{background:#dcf3e7;color:#1c4d38;}
.feedback.bad{background:#fbdbd4;color:#5c2018;}

.text-title{font-size:19px;font-weight:700;margin-bottom:4px;}
.hint{font-size:13px;color:var(--muted);margin-bottom:14px;}
.paragraph{background:#fffdf5;border:2px solid var(--card-line);border-radius:12px;padding:18px;font-size:16px;line-height:2;}
.word{padding:2px 3px;border-radius:5px;cursor:pointer;}
.word.circled{background:var(--gold);color:#26200f;box-shadow:0 0 0 2px var(--gold);}
textarea{width:100%;min-height:80px;margin-top:16px;padding:12px;border-radius:10px;border:2px solid var(--card-line);font-family:inherit;font-size:14px;resize:vertical;}
.summary-box{margin-top:14px;background:#e0eaf5;border-radius:10px;padding:14px;font-size:14px;line-height:1.5;display:none;}
.summary-box.show{display:block;}

.actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.big-icon{font-size:52px;text-align:center;margin-bottom:6px;}
.result-title{text-align:center;font-size:24px;font-weight:800;margin:0 0 6px;}
.result-sub{text-align:center;color:var(--muted);margin-bottom:16px;font-size:14px;}

.leaderboard{margin-top:18px;background:#fffdf5;border:2px solid var(--card-line);border-radius:12px;overflow:hidden;}
.leaderboard h3{margin:0;padding:12px 16px;background:#e2d6ae;font-size:13px;text-transform:uppercase;letter-spacing:1px;}
.lb-row{display:flex;justify-content:space-between;padding:10px 16px;font-size:14px;border-top:1px solid var(--card-line);}
.lb-row b{color:var(--blue);}
.lb-row.me{background:#fdf3d8;}
.lb-empty{padding:14px 16px;font-size:13px;color:var(--muted);}

footer{text-align:center;color:#8f8874;font-size:12px;margin-top:20px;}
.spin{opacity:.6;text-align:center;padding:20px;font-size:14px;}
@media(max-width:480px){.panel{padding:20px 16px;} .question{font-size:17px;}}
</style>
</head>

<div class="wrap">

   sum:"Descreve um dia frio e ventoso em que a pessoa ficou em casa lendo, observou a chuva pela janela e depois o céu limpo com estrelas à noite; refletiu sobre o quanto aprendeu no ano e sentiu orgulho do próprio progresso."},
  extra:exprData}
];

/* ================= HELPERS ================= */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickDistractors(pool,correctVal,key,n){
  const vals = pool.map(x=>x[key]).filter(v=>v!==correctVal);
  return shuffle(vals).slice(0,n);
}
function buildVocabStage(item,pool,idx){
  let question,correct,options;
  if(idx%2===0){
    question = `Qual é a tradução da palavra <b>"${item.en}"</b>?`;
    correct = item.pt;
    options = shuffle([correct,...pickDistractors(pool,correct,'pt',3)]);
  } else {
    question = `Qual é a palavra em inglês para <b>"${item.pt.split(',')[0]}"</b>?`;
    correct = item.en;
    options = shuffle([correct,...pickDistractors(pool,correct,'en',3)]);
  }
  return {kind:'vocab',tag:'Vocabulário',question,correct,options};
}
function buildExprStage(item,pool){
  const question = `O que significa a expressão <b>"${item.en}"</b>?<br><span class="sub" style="display:block;margin-top:6px;">Exemplo: <i>"${item.s}"</i></span>`;
  const correct = item.pt;
  const options = shuffle([correct,...pickDistractors(pool,correct,'pt',3)]);
  return {kind:'expr',tag:'Expressão',question,correct,options};
}
function buildReadStage(t,phaseName){
  return {kind:'read',tag:'Leitura — '+phaseName,title:t.title,p:t.p,sum:t.sum};
}

/* Build full stage list + phase boundaries */
let stages = [];
let phaseBounds = []; // {startIdx, endIdx, phaseIndex}
PHASES.forEach((ph,pi)=>{
  const start = stages.length;
  ph.words.forEach((w,i)=> stages.push({...buildVocabStage(w,ph.words,i), phaseIndex:pi}));
  stages.push({...buildReadStage(ph.text,ph.name), phaseIndex:pi});
  if(ph.extra){ ph.extra.forEach(e=> stages.push({...buildExprStage(e,ph.extra), phaseIndex:pi})); }
  phaseBounds.push({start, end:stages.length-1, phaseIndex:pi});
});
const TOTAL = stages.length;
const TOTAL_WORDS = PHASES.reduce((a,p)=>a+p.words.length,0);

/* ================= STORAGE ================= */
/* Cache local (mais rápido) — a fonte real de verdade do perfil é o Firestore */
async function getPersonal(key){ try{ const v = localStorage.getItem('trilha:'+key); return v?JSON.parse(v):null; }catch(e){ return null; } }
async function setPersonal(key,val){ try{ localStorage.setItem('trilha:'+key, JSON.stringify(val)); }catch(e){} }

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function slug(name){ return name.toLowerCase().trim().replace(/[^a-z0-9à-ú ]/gi,'').replace(/\s+/g,'-').slice(0,40); }

async function setShared(key,val){
  try{
    const ref = db.collection('ranking').doc(slug(key));
    const current = await ref.get();
    if(current.exists){
      const prev = current.data();
      const better = (val.wordsLearned > prev.wordsLearned) ||
        (val.wordsLearned === prev.wordsLearned && val.completions > prev.completions);
      if(!better) return; // mantém o recorde anterior, que é maior ou igual
    }
    await ref.set(val);
  }catch(e){ console.error('Erro ao salvar ranking:', e); }
}

async function loadLeaderboard(){
  try{
    const snap = await db.collection('ranking').orderBy('wordsLearned','desc').limit(25).get();
    const rows = snap.docs.map(d=>d.data());
    rows.sort((a,b)=> (b.wordsLearned-a.wordsLearned) || (b.completions-a.completions));
    return rows.slice(0,10);
  }catch(e){
    console.error('Erro ao carregar ranking:', e);
    return [];
  }
}

/* Perfil do jogador na nuvem — permite entrar com o mesmo nome em outro dispositivo e continuar */
async function loadPlayerFromCloud(name){
  try{
    const doc = await db.collection('players').doc(slug(name)).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error('Erro ao carregar perfil:', e); return null; }
}
async function saveStats(stats){
  await setPersonal('stats', stats);
  if(!state.player) return;
  try{
    await db.collection('players').doc(slug(state.player.name)).set({
      name: state.player.name, ...stats
    });
  }catch(e){ console.error('Erro ao sincronizar perfil:', e); }
}

/* ================= STATE ================= */
let state = { idx:0, score:0, answered:false, player:null };

/* ================= RENDER ================= */
const panel = document.getElementById('panel');

async function boot(){
  state.player = await getPersonal('profile');
  renderStart();
}

async function renderStart(){
  if(!state.player){
    panel.innerHTML = `
      <div class="center">
        <div class="tag vocab">Cadastro rápido</div>
        <h2 style="margin:6px 0 8px;">Como podemos te chamar?</h2>
        <p class="sub">Seu nome aparece no ranking desta trilha.</p>
      </div>
      <input type="text" id="nameInput" maxlength="24" placeholder="Seu nome ou apelido">
      <button class="btn btn-primary btn-block" onclick="registerPlayer()">Cadastrar e continuar</button>
    `;
    return;
  }
  panel.innerHTML = `<div class="spin">Carregando ranking...</div>`;
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  const board = await loadLeaderboard();
  const checkpointIdx = getCheckpointIdx(stats);
  const hasCheckpoint = checkpointIdx > 0;
  const checkpointPhase = hasCheckpoint ? phaseOf(checkpointIdx).phaseIndex+1 : 0;
  panel.innerHTML = `
    <div class="center">
      <div class="tag vocab">Modo clássico</div>
      <h2 style="margin:6px 0 8px;">Olá, ${state.player.name}! Pronta(o) para virar fluente?</h2>
      <p class="sub" style="margin-bottom:0;">${TOTAL_WORDS} palavras em 6 fases + 10 expressões do cotidiano.<br><b>Errou uma pergunta? Você volta ao início da fase atual, não da trilha inteira.</b> Zere o jogo para aprender todas as palavras. 😅</p>
    </div>
    <div class="stats-row">
      <div class="stat-card"><b>${stats.bestPhase}/6</b><span>Melhor fase</span></div>
      <div class="stat-card"><b>${stats.attempts}</b><span>Tentativas</span></div>
      <div class="stat-card"><b>${stats.completions}</b><span>Trilhas zeradas</span></div>
    </div>
    ${hasCheckpoint
      ? `<button class="btn btn-primary btn-block" onclick="startGame(${checkpointIdx})">⏩ Continuar de onde parei (Fase ${checkpointPhase})</button>
         <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="startGame(0)">🔄 Jogar do início</button>`
      : `<button class="btn btn-primary btn-block" onclick="startGame(0)">▶ Iniciar jogo</button>`
    }
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="switchPlayer()">Trocar jogador</button>
    <div class="leaderboard">
      <h3>🏆 Ranking — palavras aprendidas (fase mais avançada)</h3>
      ${board.length? board.map((r,i)=>`<div class="lb-row ${r.name===state.player.name?'me':''}"><span>${i+1}. ${r.name}</span><span><b>${r.wordsLearned}</b> palavras · ${r.bestPhase}/6 fases</span></div>`).join('') : '<div class="lb-empty">Ainda ninguém no ranking. Seja o primeiro!</div>'}
    </div>
  `;
}

async function registerPlayer(){
  const val = document.getElementById('nameInput').value.trim();
  if(!val){ document.getElementById('nameInput').focus(); return; }
  state.player = {name: val};
  await setPersonal('profile', state.player);
  const cloud = await loadPlayerFromCloud(val);
  const stats = cloud
    ? {attempts:cloud.attempts||0, completions:cloud.completions||0, bestPhase:cloud.bestPhase||0, bestStage:cloud.bestStage||0}
    : {attempts:0,completions:0,bestPhase:0,bestStage:0};
  await setPersonal('stats', stats);
  renderStart();
}
async function switchPlayer(){
  state.player = null;
  await setPersonal('profile', null);
  renderStart();
}

function phaseOf(idx){ return phaseBounds.find(b=> idx>=b.start && idx<=b.end); }

/* Retorna o índice do estágio onde a fase em andamento começa, para permitir continuar sem voltar ao início */
function getCheckpointIdx(stats){
  if(!stats || !stats.bestStage || stats.bestStage<=0) return 0;
  const idx = Math.min(stats.bestStage+1, TOTAL-1);
  const pb = phaseOf(idx);
  return pb.start;
}

function renderHUD(){
  const pb = phaseOf(state.idx);
  const pct = Math.round((state.idx/TOTAL)*100);
  const dots = PHASES.map((p,i)=>{
    let fillPct = 0;
    if(i < pb.phaseIndex) fillPct = 100;
    else if(i === pb.phaseIndex){
      const b = phaseBounds[i];
      fillPct = Math.round(((state.idx-b.start)/(b.end-b.start+1))*100);
    }
    return `<div class="phase-dot ${i===pb.phaseIndex?'current':''}" title="${p.icon} ${p.name}"><div class="fill" style="width:${fillPct}%"></div></div>`;
  }).join('');
  return `
    <div class="hud">
      <div class="stat">Fase ${pb.phaseIndex+1}/6<span>${PHASES[pb.phaseIndex].icon} ${PHASES[pb.phaseIndex].name}</span></div>
      <div class="stat">Pontos<span>${state.score}</span></div>
    </div>
    <div class="phase-track">${dots}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;
}

async function startGame(fromIdx=0){
  state = {idx:fromIdx,score:0,answered:false,player:state.player};
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  stats.attempts++; await saveStats(stats);
  renderStage();
}

async function updateBest(){
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  const pb = phaseOf(Math.min(state.idx, TOTAL-1));
  if(pb.phaseIndex > stats.bestPhase) stats.bestPhase = pb.phaseIndex;
  if(state.idx > stats.bestStage) stats.bestStage = state.idx;
  await saveStats(stats);
  const wordsLearned = Math.min(state.idx, TOTAL_WORDS);
  await setShared(state.player.name, {
    name: state.player.name, wordsLearned, bestPhase: stats.bestPhase+1, completions: stats.completions, date: new Date().toISOString()
  });
}

function renderStage(){
  const s = stages[state.idx];
  state.answered = false;
  if(s.kind==='read'){ renderReadStage(s); } else { renderQuestionStage(s); }
}

function renderQuestionStage(s){
  panel.innerHTML = `
    ${renderHUD()}
    <div class="tag ${s.kind}">${s.tag}</div>
    <p class="question">${s.question}</p>
    <div class="options" id="opts">
      ${s.options.map(o=>`<button class="opt" onclick="answer(this,'${encodeURIComponent(o)}','${encodeURIComponent(s.correct)}')">${o}</button>`).join('')}
    </div>
    <div id="feedbackArea"></div>
  `;
}

function answer(btn, chosenEnc, correctEnc){
  if(state.answered) return;
  state.answered = true;
  const chosen = decodeURIComponent(chosenEnc);
  const correct = decodeURIComponent(correctEnc);
  document.querySelectorAll('#opts .opt').forEach(o=>{
    o.setAttribute('disabled','true');
    if(o.textContent===correct) o.classList.add('correct');
  });
  const fb = document.getElementById('feedbackArea');
  if(chosen===correct){
    btn.classList.add('correct');
    state.score += 10;
    fb.innerHTML = `<div class="feedback ok">✅ Certo! "<b>${correct}</b>" está correto.</div>
      <div class="actions"><button class="btn btn-primary" onclick="advance()">Continuar →</button></div>`;
  } else {
    btn.classList.add('wrong');
    fb.innerHTML = `<div class="feedback bad">❌ Errado! A resposta certa era "<b>${correct}</b>".</div>
      <div class="actions"><button class="btn btn-primary" onclick="gameOver()">Ver resultado</button></div>`;
  }
}

async function advance(){
  await updateBest();
  state.idx++;
  if(state.idx >= TOTAL){ victory(); } else { renderStage(); }
}

function renderReadStage(s){
  panel.innerHTML = `
    ${renderHUD()}
    <div class="tag read">${s.tag}</div>
    <p class="text-title">${s.title}</p>
    <p class="hint">Toque nas palavras que você já conhece para circulá-las. Depois, escreva em português o que você entendeu do texto.</p>
    <div class="paragraph" id="paragraphBox"></div>
    <textarea id="commentBox" placeholder="O que você entendeu deste texto? Escreva um resumo em português..."></textarea>
    <div id="summaryArea" class="summary-box"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="revealSummary('${btoa(unescape(encodeURIComponent(s.sum)))}')">Ver resumo e comparar</button>
      <button class="btn btn-primary" onclick="advance()">Continuar →</button>
    </div>
  `;
  document.getElementById('paragraphBox').innerHTML = s.p.split(' ').map(w=>`<span class="word" onclick="this.classList.toggle('circled')">${w}</span>`).join(' ');
}

function revealSummary(b64){
  const sum = decodeURIComponent(escape(atob(b64)));
  const area = document.getElementById('summaryArea');
  area.innerHTML = `<b>📌 Resumo do texto (para comparar com o seu):</b><br>${sum}`;
  area.classList.add('show');
}

async function gameOver(){
  await updateBest();
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  const pb = phaseOf(state.idx);
  panel.innerHTML = `
    <div class="big-icon">💥</div>
    <p class="result-title">Ops! Você errou.</p>
    <p class="result-sub">Você chegou até a fase ${pb.phaseIndex+1}/6 (${PHASES[pb.phaseIndex].name}), com ${state.score} pontos.<br>Sem problema — na tela inicial você escolhe entre continuar de onde parou ou recomeçar do zero.</p>
    <div class="stats-row">
      <div class="stat-card"><b>${stats.bestPhase+1}/6</b><span>Seu recorde</span></div>
      <div class="stat-card"><b>${stats.attempts}</b><span>Tentativas</span></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="renderStart()">Ver opções</button>
  `;
}

async function victory(){
  const stats = (await getPersonal('stats')) || {attempts:0,completions:0,bestPhase:0,bestStage:0};
  stats.completions++; stats.bestPhase = 5; stats.bestStage = TOTAL;
  await saveStats(stats);
  await setShared(state.player.name, {
    name: state.player.name, wordsLearned: TOTAL_WORDS, bestPhase: 6, completions: stats.completions, date: new Date().toISOString()
  });
  panel.innerHTML = `
    <div class="big-icon">🏆</div>
    <p class="result-title">Você zerou a Trilha da Fluência!</p>
    <p class="result-sub">${TOTAL_WORDS} palavras e 10 expressões, do início ao fim, sem errar uma questão. ${state.score} pontos. Fluência é treino diário — bora manter a sequência!</p>
    <div class="stats-row">
      <div class="stat-card"><b>${stats.completions}</b><span>Trilhas zeradas</span></div>
      <div class="stat-card"><b>${stats.attempts}</b><span>Tentativas totais</span></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="startGame()">🔁 Jogar de novo</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="renderStart()">Ver ranking</button>
  `;
}

boot();
</script>
